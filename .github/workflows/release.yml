name: Release signed binaries

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

jobs:
  build-and-sign:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: target/x86_64-unknown-linux-gnu/release/xyqon
            extension: ""
            platform: linux-x86_64
          - label: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: target/x86_64-pc-windows-msvc/release/xyqon.exe
            extension: .exe
            platform: windows-x86_64

    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build locked release
        run: cargo build --release --locked --target "${{ matrix.target }}"
        shell: bash

      - name: Name release asset
        id: asset
        run: |
          asset="xyqon-${{ github.event.release.tag_name }}-${{ matrix.platform }}${{ matrix.extension }}"
          cp "${{ matrix.binary }}" "$asset"
          echo "name=$asset" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Generate SHA-256 checksum
        run: sha256sum "${{ steps.asset.outputs.name }}" > "${{ steps.asset.outputs.name }}.sha256"
        shell: bash

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign binary with GitHub OIDC
        run: |
          cosign sign-blob --yes \
            --output-signature "${{ steps.asset.outputs.name }}.sig" \
            --output-certificate "${{ steps.asset.outputs.name }}.pem" \
            "${{ steps.asset.outputs.name }}"
        shell: bash

      - name: Upload binary, checksum, and signature
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "${{ steps.asset.outputs.name }}" \
            "${{ steps.asset.outputs.name }}.sha256" \
            "${{ steps.asset.outputs.name }}.sig" \
            "${{ steps.asset.outputs.name }}.pem" \
            --clobber
        shell: bash
