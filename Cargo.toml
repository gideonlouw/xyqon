[package]
name = "xyqon"
version = "0.2.0"
edition = "2021"
description = "Community-built SHA-256 proof-of-work blockchain node"
license = "MIT"
repository = "https://github.com/gideonlouw/xyqon"
homepage = "https://xyqon.web.app"

[dependencies]
sha2 = "0.10"
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
